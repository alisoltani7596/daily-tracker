name = "daily-tracker-coach"
main = "src/index.js"
compatibility_date = "2026-01-01"

# ─── CORS allowlist ───────────────────────────────────────────────────────────
# Comma-separated list of origins allowed to call this Worker. Replace the
# GitHub Pages URL with your own (https://<your-username>.github.io). The
# localhost entries let you test against a locally served copy of the tracker.
[vars]
ALLOWED_ORIGINS = "https://alisoltani7596.github.io,http://localhost:8731,http://127.0.0.1:8731"

# Secrets are NOT stored here. Set them with `wrangler secret put <NAME>`
# (or worker/.dev.vars, gitignored, for local `wrangler dev`):
#   ANTHROPIC_API_KEY   — coach proxy to the Anthropic API
#   EDIT_TOKEN          — shared token gating POST /today-overrides (Today edits)

# ─── KV: personal "Today" dashboard data ──────────────────────────────────────
# Serves GET /today (CORS-locked to your Pages origin) instead of a public file.
# One-time setup:
#   wrangler kv namespace create TODAY_KV      # prints the id → paste it below
# The morning refresh task writes the data with:
#   wrangler kv key put --binding TODAY_KV today "$(cat today.json)"
[[kv_namespaces]]
binding = "TODAY_KV"
id = "eb6d2cc50def4921bb6d3916c51993ed"
